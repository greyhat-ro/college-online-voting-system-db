<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Vote · CampusVote</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="nav">

        <b class="brand">
            Campus<span>Vote</span>
        </b>

        <nav>
            <a href="results.html">Results</a>
            <a href="#" id="logout">Logout</a>
        </nav>

    </header>


    <main class="dash">

        <!-- Page Header -->
        <div class="head">

            <div>
                <p class="eyebrow">STUDENT PORTAL</p>

                <h1>Cast your vote</h1>

                <p class="muted">
                    Student Council Election 2026 · Demo
                </p>
            </div>

            <span class="pill">
                Voting Open
            </span>

        </div>


        <!-- Instructions -->
        <div class="notice">
            Select one candidate for each position and review your
            choices before submitting.
        </div>


        <!-- Voting Form -->
        <form id="ballot">

            <!-- President -->
            <section class="panel">

                <h2>President</h2>

                <label class="candidate">

                    <input
                        type="radio"
                        name="president"
                        value="Aisha Rahman"
                        required
                    >

                    <span>
                        <b>Aisha Rahman</b>
                        <small>
                            Computer Science · Year III
                        </small>
                    </span>

                </label>


                <label class="candidate">

                    <input
                        type="radio"
                        name="president"
                        value="Rohan Das"
                    >

                    <span>
                        <b>Rohan Das</b>
                        <small>
                            Information Technology · Year III
                        </small>
                    </span>

                </label>


                <label class="candidate">

                    <input
                        type="radio"
                        name="president"
                        value="Neha Sharma"
                    >

                    <span>
                        <b>Neha Sharma</b>
                        <small>
                            Commerce · Year II
                        </small>
                    </span>

                </label>

            </section>


            <!-- General Secretary -->
            <section class="panel">

                <h2>General Secretary</h2>

                <label class="candidate">

                    <input
                        type="radio"
                        name="secretary"
                        value="Arjun Mehta"
                        required
                    >

                    <span>
                        <b>Arjun Mehta</b>
                        <small>
                            Management · Year III
                        </small>
                    </span>

                </label>


                <label class="candidate">

                    <input
                        type="radio"
                        name="secretary"
                        value="Priya Nair"
                    >

                    <span>
                        <b>Priya Nair</b>
                        <small>
                            Computer Applications · Year II
                        </small>
                    </span>

                </label>

            </section>


            <!-- Submit -->
            <button
                type="submit"
                class="btn"
            >
                Submit Vote
            </button>

            <p
                id="voteMsg"
                class="message"
            ></p>

        </form>

    </main>


    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration -->
    <script src="js/supabase.js"></script>

    <!-- Student/Voting Logic -->
    <script src="js/student.js"></script>

</body>
</html>
